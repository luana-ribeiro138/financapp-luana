<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha conta | FinancApp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="telaApp">
      <button id="btnSair" type="button">Sair</button>

      <section class="perfil">
        <img id="perfilFoto" alt="Foto do perfil" width="80" height="80" />
        <div>
          <h1 id="perfilNome"></h1>
          <p id="perfilTurma"></p>
        </div>
      </section>

      <section class="painel-saldo" aria-labelledby="tituloSaldo">
        <h2 id="tituloSaldo">Saldo</h2>
        <p id="saldoValor">R$ 0,00</p>
      </section>

      <form id="formLancamento">
        <h2>Novo lançamento</h2>
        <input id="lancDescricao" type="text" placeholder="Descrição" required />
        <input id="lancValor" type="number" step="0.01" min="0.01" placeholder="Valor" required />
        <select id="lancTipo" aria-label="Tipo de lançamento">
          <option value="receita">Receita</option>
          <option value="despesa">Despesa</option>
        </select>
        <input id="lancTags" type="text" placeholder="Tags (separadas por vírgula)" />
        <button type="submit">Salvar</button>
      </form>

      <section aria-labelledby="tituloExtrato">
        <h2 id="tituloExtrato">Extrato</h2>
        <div id="extratoContainer"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script src="financapp.js"></script>
  </body>
</html>
